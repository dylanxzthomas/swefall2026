<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1390" viewBox="0 0 2500 1390" role="img" aria-labelledby="title desc">
<title id="title">Sola architecture — personal, proactive, accountable</title>
<desc id="desc">Target architecture for Daymark. Chat, voice, connected app events, due times and verified responses trigger Sola's conversation coordinator. Recent context and confirmed family memory inform bounded task workers. Saved task specifications configure wakeups. Workers prepare with granted read tools; an isolated sandbox is optional. Parent approval precedes external execution through authorized provider adapters or the connected iPhone. Verification records receipts and chooses a reply, app update or silence. Convex stores durable task state separately from conversational and family memory; a memory curator proposes updates after relevant work. This is a design, not a deployment or feature-completion claim.</desc>
